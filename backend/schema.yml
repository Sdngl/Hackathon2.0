openapi: 3.0.3
info:
  title: HealthTech AI API
  version: 1.0.0
  description: Stateless AI processing API for the HealthTech application.
paths:
  /api/v1/analyze/meal/:
    post:
      operationId: v1_analyze_meal_create
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUpload'
        required: true
      security:
      - FirebaseBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/analyze/medicine/:
    post:
      operationId: v1_analyze_medicine_create
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUpload'
        required: true
      security:
      - FirebaseBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/analyze/report/:
    post:
      operationId: v1_analyze_report_create
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportUpload'
      security:
      - FirebaseBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/chat/:
    post:
      operationId: v1_chat_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chat'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Chat'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Chat'
        required: true
      security:
      - FirebaseBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                  error:
                    nullable: true
          description: ''
components:
  schemas:
    Chat:
      type: object
      properties:
        message:
          type: string
          maxLength: 4000
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
        context: {}
      required:
      - message
    HistoryItem:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        content:
          type: string
          maxLength: 2000
      required:
      - content
      - role
    ImageUpload:
      type: object
      properties:
        image:
          type: string
          format: uri
      required:
      - image
    ReportUpload:
      type: object
      properties:
        file:
          type: string
          format: uri
          nullable: true
        image:
          type: string
          format: uri
          nullable: true
    RoleEnum:
      enum:
      - user
      - assistant
      type: string
      description: |-
        * `user` - user
        * `assistant` - assistant
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: Firebase Authentication ID token
